<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graph Choices · Dependency graph</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17372a;background:#f6faf7;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:20px 26px 14px;border-bottom:1px solid #dce8df;background:white}h1{font:650 25px/1.2 Georgia,serif;margin:0 0 7px;letter-spacing:-.35px}.sub{color:#52695d;font-size:13px;line-height:1.5}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{border:1px solid #b2d9bf;border-radius:20px;background:#e5f5e9;color:#16683c;padding:7px 12px;white-space:nowrap;font-weight:600}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:17px}input,select,button{font:inherit;border:1px solid #c8d9ce;background:white;color:#17372a;padding:8px 10px;border-radius:7px}input{width:230px}button{cursor:pointer}button:hover,select:hover{background:#edf5ef}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8dc9ab;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 335px;height:calc(100dvh - 175px);min-height:460px}main{position:relative;overflow:hidden;background:radial-gradient(#ccded2 .6px,transparent .6px);background-size:18px 18px}.graph{height:100%;width:100%}.graph svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.graph svg:active{cursor:grabbing}.hidden{display:none!important}aside{overflow:auto;padding:23px;background:white;border-left:1px solid #dce8df}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#688675;font-weight:700}h2{font-size:19px;line-height:1.3;margin:8px 0;overflow-wrap:anywhere}h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;margin:24px 0 10px;color:#688675}p{line-height:1.6;color:#51685c;font-size:13px}a{color:#176a43;text-decoration:none}a:hover{text-decoration:underline}.source{display:inline-block;margin:4px 0 10px;padding:8px 11px;background:#e8f4eb;border-radius:6px;font-weight:600}ul{padding:0;list-style:none;margin:0}li{padding:6px 0;border-bottom:1px solid #eef3ef;font-size:12px;overflow-wrap:anywhere}li button{padding:2px 0;border:0;border-radius:0;text-align:left;background:none;color:#176a43;font-size:12px}.stats{display:flex;gap:14px;font-size:12px;color:#5b7565;margin:11px 0}.stats strong{color:#145c39}.legend{padding:15px 20px;background:#fffffff0;border-top:1px solid #dce8df;position:absolute;bottom:0;left:0;right:0;font-size:11px;display:flex;gap:16px;flex-wrap:wrap;pointer-events:none}.key{display:inline-block;background:#c7f0c2;border:1.5px solid #23834e;width:16px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}.key.goal{background:#1c8054;border:2px double #105b3a;border-radius:50%}.small{font-size:11px;color:#789080;line-height:1.6}.node{transition:opacity .15s;cursor:pointer}.node.dim{opacity:.14}.edge.dim{opacity:.07}.node.selected polygon,.node.selected path,.node.selected ellipse{stroke:#174baf!important;stroke-width:3.5!important}.node.selected text{font-weight:700}.node:focus{outline:none}.node:focus path,.node:focus ellipse{stroke:#174baf;stroke-width:3}.edge path{pointer-events:none}#visible-count{position:absolute;top:12px;left:14px;font-size:11px;color:#4f6b5b;padding:6px 9px;background:#fffffff0;border:1px solid #e0eae2;border-radius:6px}details{font-size:12px;line-height:1.7;color:#597365;margin-top:18px}summary{cursor:pointer;font-weight:600}.empty{color:#789080;font-style:italic}.counter{font-variant-numeric:tabular-nums}
@media(max-width:850px){header{padding:15px}h1{font-size:22px}.top{gap:8px;align-items:start}.badge{font-size:11px}.layout{grid-template-columns:1fr;grid-template-rows:minmax(330px,1fr) 240px;height:calc(100dvh - 215px);min-height:600px}aside{border-left:0;border-top:1px solid #dce8df;padding:16px}input{width:180px}.toolbar{gap:6px;margin-top:12px}.toolbar button,.toolbar select{font-size:12px;padding:7px}aside h3{margin:15px 0 7px}.legend{padding:10px 12px;gap:8px;font-size:10px}}
</style></head><body>
<header><div class="top"><div><h1>Online graph balancing</h1><div class="sub">PFR-style dependency atlas · Lean formalization · file imports</div></div><div class="badge">● Both main theorems checked</div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Find a Lean file…" aria-label="Search modules" list="module-list"><datalist id="module-list"></datalist><button id="find">Find</button><select id="focus" aria-label="Graph focus"><option value="all">All files</option><option value="MainProof">Upper-bound imports</option><option value="GreedyLowerBound">Lower-bound imports</option><option value="near">Selected neighborhood</option></select><select id="edge-mode" aria-label="Edge display"><option value="reduced">Reduced imports</option><option value="full">All direct imports</option></select><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="reset">Reset</button></div></header>
<div class="layout"><main><div id="graph-reduced" class="graph">__REDUCED_SVG__</div><div id="graph-full" class="graph hidden">__FULL_SVG__</div><div id="visible-count"></div><div class="legend"><span><i class="key"></i>Checked module</span><span><i class="key goal"></i>Main theorem file</span><span>Arrows: prerequisite → importing file</span><span>Drag to pan · scroll to zoom · click a node</span></div></main><aside id="details" aria-live="polite"></aside></div>
<script>
'use strict';
const data=__GRAPH_DATA__;
const byId=Object.fromEntries(data.nodes.map(n=>[n.id,n]));
const users=Object.fromEntries(data.nodes.map(n=>[n.id,[]]));
for(const [a,b] of data.fullEdges)users[a].push(b);
const state={selected:null,mode:'reduced',focus:'all',boxes:{},drag:null};
const goals={MainProof:'Theorem 1.1 · Online upper bound',GreedyLowerBound:'Theorem 1.2 · Greedy lower bound'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function closure(id,direction){const seen=new Set();function visit(x){for(const y of direction==='up'?byId[x].imports:users[x])if(!seen.has(y)){seen.add(y);visit(y)}}visit(id);return seen}
function svg(){return document.querySelector('#graph-'+state.mode+' svg')}
function allowed(){if(state.focus==='all')return new Set(data.nodes.map(n=>n.id));if(state.focus==='near'){if(!state.selected)return new Set(data.nodes.map(n=>n.id));return new Set([state.selected,...byId[state.selected].imports,...users[state.selected]])}return new Set([state.focus,...closure(state.focus,'up')])}
function viewBox(v){svg().setAttribute('viewBox',[v.x,v.y,v.w,v.h].join(' '));state.boxes[state.mode]=v}
function box(){const v=svg().viewBox.baseVal;return{x:v.x,y:v.y,w:v.width,h:v.height}}
function fit(ids=allowed()){
 const root=svg(), inverse=root.getScreenCTM().inverse();let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 for(const id of ids){const el=root.querySelector('#node-'+id);if(!el||el.classList.contains('hidden'))continue;const b=el.getBBox(),m=inverse.multiply(el.getScreenCTM());for(const [x,y]of[[b.x,b.y],[b.x+b.width,b.y+b.height]]){const p=new DOMPoint(x,y).matrixTransform(m);minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}}
 if(Number.isFinite(minX))viewBox({x:minX-35,y:minY-35,w:Math.max(120,maxX-minX+70),h:Math.max(120,maxY-minY+105)})
}
function zoom(factor,point){const root=svg(),v=box(),p=point||{x:v.x+v.w/2,y:v.y+v.h/2};const w=Math.max(70,Math.min(50000,v.w*factor)),ratio=w/v.w;viewBox({x:p.x+(v.x-p.x)*ratio,y:p.y+(v.y-p.y)*ratio,w,h:v.h*ratio})}
function render(){
 const show=allowed();const lit=state.selected?new Set([state.selected,...closure(state.selected,'up')]):show;
 for(const mode of ['reduced','full']){const root=document.querySelector('#graph-'+mode+' svg');for(const n of data.nodes){const el=root.querySelector('#node-'+n.id);el.classList.toggle('hidden',!show.has(n.id));el.classList.toggle('dim',show.has(n.id)&&!lit.has(n.id));el.classList.toggle('selected',state.selected===n.id)}for(const [a,b]of data[mode==='full'?'fullEdges':'reducedEdges']){const el=root.querySelector('#edge-'+a+'--'+b);el.classList.toggle('hidden',!show.has(a)||!show.has(b));el.classList.toggle('dim',!lit.has(a)||!lit.has(b))}}
 document.querySelector('#visible-count').textContent=`${show.size} / ${data.moduleCount} files · ${state.mode==='full'?data.fullEdges.length:data.reducedEdges.length} ${state.mode==='full'?'direct':'reduced'} import edges`;
 panel()
}
function links(ids){return ids.length?'<ul>'+ids.map(id=>`<li><button data-select="${esc(id)}">${esc(id)}</button></li>`).join('')+'</ul>':'<span class="empty">None within this project</span>'}
function panel(){
 const p=document.querySelector('#details');
 if(!state.selected){p.innerHTML=`<div class="eyebrow">Formalization status</div><h2>Two complete main proofs</h2><div class="stats"><span><strong>${data.moduleCount}</strong> files</span><span><strong>${data.theoremCount}</strong> checked results</span></div><p>Select a node to see its imports, declarations and source. Its prerequisite files stay highlighted.</p><h3>Main theorem files</h3>${links(['MainProof','GreedyLowerBound'])}<h3>Read this graph</h3><p>Edges are extracted from actual <code>import GraphChoices.…</code> lines. Reduced mode removes transitively redundant edges while preserving every import path.</p><p class="small">This is a file dependency graph, not a graph of constants referenced by individual theorem proofs. Unformalized auxiliary paper statements are not displayed as nodes.</p><h3>Offline exports</h3><p><a href="dependencies.svg">SVG</a> · <a href="dependencies.dot">Graphviz DOT</a> · <a href="dependencies.json">JSON data</a></p><p class="small">All named results passed the packaged axiom audit. Only standard propext, Classical.choice and Quot.sound occur.</p>`;return}
 const n=byId[state.selected];p.innerHTML=`<div class="eyebrow">Checked Lean module</div><h2>${esc(n.id)}</h2>${goals[n.id]?'<p><strong>'+esc(goals[n.id])+'</strong></p>':''}<div class="stats"><span><strong>${n.theorems}</strong> proved results</span><span><strong>${n.declarations.length}</strong> declarations</span></div><p>${esc(n.summary||'No module summary supplied.')}</p><a class="source" href="sources/${esc(n.id)}.html">Read Lean source ↗</a><h3>Direct project imports</h3>${links(n.imports)}<h3>Imported by</h3>${links(users[n.id])}<h3>Declarations</h3><ul>${n.declarations.map(d=>`<li><a href="sources/${esc(n.id)}.html#L${d.line}" title="${esc(d.name)}">${esc(d.name.replace(/^GraphChoices\./,''))}</a><br><span class="small">${esc(d.kind)} · line ${d.line}</span></li>`).join('')}</ul><details><summary>Provenance</summary><p class="small">Source: ${esc(n.file)}<br>SHA-256: ${esc(n.sha256)}</p></details>`
}
function select(id,center=false){if(!byId[id])return;state.selected=id;document.querySelector('#search').value=id;render();if(center)fit(new Set([id,...byId[id].imports,...users[id]]))}
for(const n of data.nodes){const option=document.createElement('option');option.value=n.id;document.querySelector('#module-list').append(option)}
for(const mode of ['reduced','full']){
 const root=document.querySelector('#graph-'+mode+' svg');root.removeAttribute('width');root.removeAttribute('height');root.setAttribute('aria-label','Lean file import dependency graph');
 for(const n of data.nodes){const el=root.querySelector('#node-'+n.id);el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',`${n.id}, ${n.theorems} checked results`);el.addEventListener('click',e=>{if(state.drag?.moved||root.dataset.dragged)return;e.stopPropagation();select(n.id)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id)}})}
 root.addEventListener('wheel',e=>{e.preventDefault();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(root.getScreenCTM().inverse());zoom(Math.exp(Math.max(-1,Math.min(1,e.deltaY*.0018))),p)},{passive:false});
 root.addEventListener('pointerdown',e=>{if(e.button!==0)return;state.drag={x:e.clientX,y:e.clientY,v:box(),moved:false}});
 root.addEventListener('pointermove',e=>{if(!state.drag)return;const d=state.drag;if(!d.moved&&Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)>4){d.moved=true;root.setPointerCapture(e.pointerId)}if(!d.moved)return;const m=root.getScreenCTM().inverse(),p0=new DOMPoint(d.x,d.y).matrixTransform(m),p1=new DOMPoint(e.clientX,e.clientY).matrixTransform(m),v=box();viewBox({x:v.x+p0.x-p1.x,y:v.y+p0.y-p1.y,w:v.w,h:v.h});d.x=e.clientX;d.y=e.clientY});
 root.addEventListener('pointercancel',()=>{state.drag=null});
 root.addEventListener('pointerup',()=>{const moved=state.drag?.moved;state.drag=null;if(moved)root.dataset.dragged='true';setTimeout(()=>delete root.dataset.dragged,0)});
}
document.querySelector('#details').addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b)select(b.dataset.select,true)});
function find(){const q=document.querySelector('#search').value.trim().toLowerCase();const n=data.nodes.find(n=>n.id.toLowerCase()===q)||data.nodes.find(n=>n.id.toLowerCase().includes(q));if(n)select(n.id,true)}
document.querySelector('#find').onclick=find;document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
document.querySelector('#focus').onchange=e=>{state.focus=e.target.value;if(byId[state.focus])state.selected=state.focus;render();fit()};
document.querySelector('#edge-mode').onchange=e=>{state.mode=e.target.value;for(const mode of ['reduced','full'])document.querySelector('#graph-'+mode).classList.toggle('hidden',mode!==state.mode);render();fit()};
document.querySelector('#zoom-in').onclick=()=>zoom(.72);document.querySelector('#zoom-out').onclick=()=>zoom(1.38);document.querySelector('#fit').onclick=()=>fit();document.querySelector('#reset').onclick=()=>{state.selected=null;state.focus='all';document.querySelector('#focus').value='all';document.querySelector('#search').value='';render();fit()};
render();requestAnimationFrame(()=>fit());window.addEventListener('resize',()=>fit());
</script></body></html>
